<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Calistenia</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,system-ui;color:#f9fafb;background:#0b1220}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom));max-width:700px;margin:auto}h1{font-size:27px}h2{font-size:19px}p,small{color:#9ca3af}.card{background:#192335;border:1px solid #303b4d;border-radius:17px;padding:16px;margin:12px 0}button,input,select{font:inherit}button{background:#8bffb3;color:#092014;border:0;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}button.secondary{background:#344156;color:white}button.danger{background:#58303a;color:#ffd5db}input,select{background:#101827;border:1px solid #4b5563;color:white;border-radius:9px;padding:11px;min-width:0;width:100%}label{display:block;margin:10px 0 4px;color:#cbd5e1;font-size:13px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.muted{color:#a1a1aa}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#2c394d;color:#b7f7ce;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#101827;border-top:1px solid #344156;display:flex;padding:10px 10px calc(10px + env(safe-area-inset-bottom));justify-content:space-around}nav button{background:transparent;color:#b6c2d4;padding:10px;font-size:13px}nav button.active{background:#8bffb3;color:#092014}section{display:none}section.active{display:block}.exercise{border-top:1px solid #344156;padding:12px 0}.exercise:first-child{border:0}.sets{font-weight:700;color:#8bffb3}.timer{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}button:disabled{opacity:.45}</style></head><body><header><h1>💪 Calistenia</h1><p>Entrena a tu ritmo. Registra tu progreso.</p></header><section id="home" class="active"><h2>Mis rutinas</h2><div id="routines"></div><div class="card"><h2>Nueva rutina</h2><label>Nombre</label><input id="routineName" placeholder="Ej. Tren superior"><button style="margin-top:12px" onclick="addRoutine()">Crear rutina</button></div></section><section id="editor"><button class="secondary" onclick="tab('home')">← Volver</button><h2 id="editTitle"></h2><div id="editExercises"></div><div class="card"><h2>Añadir ejercicio</h2><label>Ejercicio</label><select id="exerciseSelect"></select><label>Series</label><input id="exerciseSets" type="number" min="1" max="30" value="3"><label>Repeticiones (o segundos)</label><input id="exerciseReps" type="number" min="1" max="3600" value="10"><label>Descanso en segundos</label><input id="exerciseRest" type="number" min="0" max="3600" value="60"><button style="margin-top:12px" onclick="addExercise()">Añadir a rutina</button><label>Crear ejercicio personalizado</label><div class="row"><input id="customExercise" placeholder="Nombre del ejercicio"><button class="secondary" onclick="addCustom()">Guardar</button></div></div></section><section id="workout"><button class="secondary" onclick="tab('home')">← Salir</button><h2 id="workoutTitle"></h2><div id="workoutExercises"></div><div class="card"><div class="muted">Descanso</div><div class="timer" id="timer">01:00</div><div class="row"><button class="secondary" onclick="startTimer()">Iniciar</button><button class="secondary" onclick="pauseTimer()">Pausar</button><button class="secondary" onclick="resetTimer()">Reiniciar</button></div></div><button style="width:100%" onclick="finishWorkout()">Finalizar y guardar entrenamiento</button></section><section id="history"><h2>Historial de entrenamientos</h2><div id="historyList"></div></section><nav><button id="navhome" class="active" onclick="tab('home')">🏠 Rutinas</button><button id="navhistory" onclick="tab('history')">📈 Historial</button></nav><script>
const KEY='calistenia-v1';const defaults=['Flexiones','Dominadas','Sentadillas','Fondos','Plancha (segundos)','Zancadas','Elevaciones de piernas','Burpees','Remo invertido','Puente de glúteos'];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.routines))data={routines:[{id:1,name:'Full body inicial',exercises:[{name:'Flexiones',sets:3,reps:10,rest:60},{name:'Sentadillas',sets:3,reps:15,rest:60},{name:'Plancha (segundos)',sets:3,reps:30,rest:45}]}],history:[],custom:[]};data.history??=[];data.custom??=[];let current=null,done={},seconds=60,interval=null;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tab(id){document.querySelectorAll('section').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('nav button').forEach(e=>e.classList.toggle('active',e.id==='nav'+id));if(id==='home')renderRoutines();if(id==='history')renderHistory();window.scrollTo(0,0)}function renderRoutines(){$('routines').innerHTML=data.routines.map(r=>`<div class="card"><strong>${escapeHtml(r.name)}</strong><p>${r.exercises.length} ejercicios</p><div class="row"><button onclick="startWorkout(${r.id})" ${r.exercises.length?'':'disabled'}>Entrenar</button><button class="secondary" onclick="editRoutine(${r.id})">Editar</button><button class="danger" onclick="deleteRoutine(${r.id})">Eliminar</button></div></div>`).join('')||'<p>Crea tu primera rutina.</p>'}function addRoutine(){let name=$('routineName').value.trim();if(!name)return alert('Escribe un nombre');let id=Date.now();data.routines.push({id,name,exercises:[]});$('routineName').value='';save();editRoutine(id)}function deleteRoutine(id){if(!confirm('¿Eliminar esta rutina?'))return;data.routines=data.routines.filter(r=>r.id!==id);save();renderRoutines()}function getRoutine(){return data.routines.find(r=>r.id===current)}function editRoutine(id){current=id;let r=getRoutine();$('editTitle').textContent=r.name;renderEdit();tab('editor')}function renderEdit(){let r=getRoutine();$('editExercises').innerHTML=r.exercises.map((e,i)=>`<div class="card"><strong>${escapeHtml(e.name)}</strong><p>${e.sets} series × ${e.reps} ${e.name.includes('segundos')?'segundos':'reps'} · ${e.rest}s descanso</p><button class="danger" onclick="removeExercise(${i})">Quitar</button></div>`).join('')||'<p>Esta rutina todavía no tiene ejercicios.</p>';$('exerciseSelect').innerHTML=[...new Set([...defaults,...data.custom])].map(e=>`<option>${escapeHtml(e)}</option>`).join('')}function addCustom(){let name=$('customExercise').value.trim();if(!name)return;if(!data.custom.includes(name))data.custom.push(name);$('customExercise').value='';save();renderEdit();$('exerciseSelect').value=name}function addExercise(){let r=getRoutine();let sets=+$('exerciseSets').value,reps=+$('exerciseReps').value,rest=+$('exerciseRest').value;if(!Number.isInteger(sets)||sets<1||sets>30||!Number.isInteger(reps)||reps<1||reps>3600||!Number.isInteger(rest)||rest<0||rest>3600)return alert('Revisa series, repeticiones y descanso');r.exercises.push({name:$('exerciseSelect').value,sets,reps,rest});save();renderEdit()}function removeExercise(i){getRoutine().exercises.splice(i,1);save();renderEdit()}function startWorkout(id){current=id;done={};resetTimer();$('workoutTitle').textContent=getRoutine().name;renderWorkout();tab('workout')}function renderWorkout(){let r=getRoutine();$('workoutExercises').innerHTML=r.exercises.map((e,i)=>`<div class="card"><strong>${escapeHtml(e.name)}</strong><p>Objetivo: ${e.sets} × ${e.reps} · Descanso ${e.rest}s</p><div class="sets">${done[i]||0} / ${e.sets} series completadas</div><div class="row" style="margin-top:10px"><button ${done[i]>=e.sets?'disabled':''} onclick="completeSet(${i})">✓ Completar serie</button><button class="secondary" onclick="undoSet(${i})">Deshacer</button></div></div>`).join('')}function completeSet(i){let e=getRoutine().exercises[i];done[i]=Math.min(e.sets,(done[i]||0)+1);seconds=e.rest;updateTimer();pauseTimer();if(seconds>0)startTimer();renderWorkout()}function undoSet(i){done[i]=Math.max(0,(done[i]||0)-1);renderWorkout()}function updateTimer(){$('timer').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}function pauseTimer(){if(interval){clearInterval(interval);interval=null}}function startTimer(){if(interval||seconds<=0)return;interval=setInterval(()=>{seconds--;updateTimer();if(seconds<=0){pauseTimer();if(navigator.vibrate)navigator.vibrate(200)}},1000)}function resetTimer(){pauseTimer();seconds=60;updateTimer()}function finishWorkout(){let r=getRoutine();if(!confirm('¿Guardar esta sesión en el historial?'))return;data.history.unshift({date:new Date().toISOString(),routine:r.name,exercises:r.exercises.map((e,i)=>({name:e.name,setsDone:done[i]||0,target:e.sets,reps:e.reps}))});save();resetTimer();tab('history')}function renderHistory(){$('historyList').innerHTML=data.history.map(h=>`<div class="card"><strong>${escapeHtml(h.routine)}</strong><p>${new Date(h.date).toLocaleString('es-ES')}</p>${h.exercises.map(e=>`<div class="exercise">${escapeHtml(e.name)}: ${e.setsDone}/${e.target} series · ${e.reps} reps/seg objetivo</div>`).join('')}</div>`).join('')||'<p>Aún no has registrado entrenamientos.</p>'}renderRoutines();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
